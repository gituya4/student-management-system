<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Data | SMsystem</title>
    <div th:replace="~{fragments/header :: styles}"></div>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4 animate-up">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">
            <div class="glass-card shadow-lg p-5">
                <div class="d-flex align-items-center mb-5">
                    <div class="bg-primary bg-opacity-10 rounded-4 p-3 me-3">
                        <i class="bi bi-person-badge-fill text-primary display-6 m-0"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold m-0 text-dark" th:text="${student.id == null ? 'New Student Entry' : 'Update Student Record'}">Student Entry</h2>
                        <p class="text-muted small m-0">Electronic Student Information Management</p>
                    </div>
                </div>

                <form th:action="@{/students/save}" th:object="${student}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row g-4 mb-4">
                        <div class="col-12">
                            <label for="name" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Full Legal Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="name" th:field="*{name}" placeholder="Enter full name of the student">
                            </div>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Institutional Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="email" th:field="*{email}" placeholder="student.name@university.edu">
                            </div>
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <div class="col-md-7">
                            <label for="program" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Primary Academic Program</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-mortarboard"></i></span>
                                <select class="form-select bg-light border-0 shadow-none p-3 h6 mb-0" id="program" th:field="*{program}">
                                    <option value="">Select Departmental Program</option>
                                    <th:block th:each="p : ${ {'Computer Science', 'Information Technology', 'Mechanical Engineering', 'Business Administration', 'Nursing'} }">
                                        <option th:value="${p}" th:text="${p}"></option>
                                    </th:block>
                                </select>
                            </div>
                            <div th:if="${#fields.hasErrors('program')}" th:errors="*{program}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <div class="col-md-5">
                            <label for="year" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Year of Study</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-calendar3"></i></span>
                                <input type="number" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="year" th:field="*{year}" min="1" max="5">
                            </div>
                            <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center gap-3 mt-5 pt-4 border-top">
                        <a th:href="@{/students}" class="text-decoration-none text-muted fw-bold small p-2">Discard Changes</a>
                        <button type="submit" class="btn btn-primary px-5 py-3 d-flex align-items-center rounded-4 h6 mb-0">
                            <i class="bi bi-shield-check-fill me-2 fs-5"></i> 
                            <span th:text="${student.id == null ? 'Finalize Registration' : 'Update Record'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
