<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="styles">
    <!-- 
        Meta & CSS Fragment
        This ensures both Bootstrap CDN and local style.css are included together.
        Updated brand name to SMsystem (removed Pro+ suffix).
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .page-header {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .counter-card {
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .counter-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg glass-nav sticky-top mb-5">
        <div class="container line-height-1">
            <!-- Updated Brand Label to SMsystem (Simplification requested) -->
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <div class="bg-primary bg-opacity-10 p-2 rounded-3 me-2 d-flex">
                    <i class="bi bi-rocket-takeoff-fill text-primary"></i>
                </div>
                <span>SMsystem</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-3"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/}" 
                           th:classappend="${currentUri == '/' ? 'active' : ''}">
                            <i class="bi bi-house-door me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/students}"
                           th:classappend="${currentUri != null && currentUri.startsWith('/students') ? 'active' : ''}">
                            <i class="bi bi-people me-2"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/courses}"
                           th:classappend="${currentUri != null && currentUri.startsWith('/courses') ? 'active' : ''}">
                            <i class="bi bi-journal-bookmark me-2"></i> Courses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center" th:href="@{/registrations}"
                           th:classappend="${currentUri != null && currentUri.startsWith('/registrations') ? 'active' : ''}">
                            <i class="bi bi-clipboard-check me-2"></i> Registrations
                        </a>
                    </li>
                </ul>
                <div class="ms-lg-4 d-none d-lg-block">
                    <a th:href="@{/registrations/register}" class="btn btn-primary d-flex align-items-center">
                        <i class="bi bi-plus-lg me-2"></i> Register Student
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
