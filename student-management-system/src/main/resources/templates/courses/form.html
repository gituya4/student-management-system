<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 
    Course Entry Form Template
    Used for both Creating a new course and Editing an existing one.
    Features: Glassmorphism UI, Bootstrap 5 integration, and Real-time validation feedback.
-->
<head>
    <title>Course Catalog Details | SMsystem</title>
    <!-- Common Styles Fragment -->
    <div th:replace="~{fragments/header :: styles}"></div>
</head>
<body>

<!-- Integrated Navbar Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4 animate-up">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">
            <div class="glass-card shadow-lg p-5">
                <!-- Header with Icon -->
                <div class="d-flex align-items-center mb-5">
                    <div class="bg-success bg-opacity-10 rounded-4 p-3 me-3">
                        <i class="bi bi-journal-plus text-success display-6 m-0"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold m-0 text-dark" th:text="${course.id == null ? 'Add New Course to Catalog' : 'Update Course Specifications'}">Course Entry</h2>
                        <p class="text-muted small m-0">Maintain university academic curriculum and credit allocations</p>
                    </div>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/courses/save}" th:object="${course}" method="post">
                    <!-- Hidden ID field for Update operations -->
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row g-4 mb-4">
                        <!-- Course Name -->
                        <div class="col-md-8">
                            <label for="courseName" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Formal Course Title</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-bookmark-star"></i></span>
                                <input type="text" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="courseName" th:field="*{courseName}" placeholder="e.g. Data Structures & Algorithms">
                            </div>
                            <div th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <!-- Course Code -->
                        <div class="col-md-4">
                            <label for="courseCode" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Unique Module Code</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-hash"></i></span>
                                <input type="text" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0 text-uppercase" id="courseCode" th:field="*{courseCode}" placeholder="CS-202">
                            </div>
                            <div th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <!-- Lecturer -->
                        <div class="col-md-8">
                            <label for="lecturer" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Primary Course Instructor</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-person-workspace"></i></span>
                                <input type="text" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="lecturer" th:field="*{lecturer}" placeholder="Full Name of Lecturer">
                            </div>
                            <div th:if="${#fields.hasErrors('lecturer')}" th:errors="*{lecturer}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>

                        <!-- Credits -->
                        <div class="col-md-4">
                            <label for="credits" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Academic Credits (CR)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-award"></i></span>
                                <input type="number" class="form-control bg-light border-0 shadow-none p-3 h6 mb-0" id="credits" th:field="*{credits}" min="1" max="10">
                            </div>
                            <div th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}" class="text-danger smallest fw-bold mt-2 ps-1"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-end align-items-center gap-3 mt-5 pt-4 border-top">
                        <a th:href="@{/courses}" class="text-decoration-none text-muted fw-bold small p-2">Cancel Entry</a>
                        <button type="submit" class="btn btn-success px-5 py-3 d-flex align-items-center rounded-4 h6 mb-0 shadow-sm">
                            <i class="bi bi-save2-fill me-2 fs-5"></i> 
                            <span th:text="${course.id == null ? 'Finalize Catalog Entry' : 'Apply Catalog Changes'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Information Hub -->
            <div class="mt-4 p-4 border rounded-4 border-dashed bg-white bg-opacity-50">
                <p class="small text-muted mb-0">
                    <i class="bi bi-info-circle me-1 text-primary"></i> 
                    <strong>Instruction:</strong> Ensure course codes are unique to avoid overlap in the academic registry. Credits will determine student load.
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
