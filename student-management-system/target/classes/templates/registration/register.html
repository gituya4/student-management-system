<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 
    Course Enrollment Form Template
    Allows assigning a student to a specific course module.
    Features: Responsive selectors, Modern glass background, and Action-oriented design.
-->
<head>
    <title>Course Enrollment | SMsystem</title>
    <div th:replace="~{fragments/header :: styles}"></div>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4 animate-up">
    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-8">
            <div class="glass-card shadow-lg p-5 border-top border-info border-opacity-50">
                <!-- Enrollment Header -->
                <div class="d-flex align-items-center mb-5">
                    <div class="bg-info bg-opacity-10 rounded-4 p-3 me-3">
                        <i class="bi bi-pencil-square text-info display-6 m-0"></i>
                    </div>
                    <div>
                        <h2 class="fw-bold m-0 text-dark">Course Enrollment</h2>
                        <p class="text-muted small m-0">Register student records into the academic course catalog.</p>
                    </div>
                </div>

                <hr class="mb-5 opacity-25">
                
                <!-- Registration Form Logic -->
                <form th:action="@{/registrations/save}" th:object="${registration}" method="post">
                    
                    <div class="row g-4 mb-4">
                        <!-- Student Selection Dropdown -->
                        <div class="col-12">
                            <label for="studentId" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Select Active Student</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-person-check text-success"></i></span>
                                <select class="form-select bg-light border-0 shadow-none p-4 h6 mb-0" id="studentId" th:field="*{studentId}" required>
                                    <option value="">Enroll Student...</option>
                                    <option th:each="student : ${students}" 
                                            th:value="${student.id}" 
                                            th:text="${'#STU' + student.id + ' | ' + student.name + ' | ' + student.program + ' (Year ' + student.year + ')'}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Course Selection Dropdown -->
                        <div class="col-12">
                            <label for="courseId" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Select Module Specification</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-book-half text-primary"></i></span>
                                <select class="form-select bg-light border-0 shadow-none p-4 h6 mb-0" id="courseId" th:field="*{courseId}" required>
                                    <option value="">Assign Module...</option>
                                    <option th:each="course : ${courses}" 
                                            th:value="${course.id}" 
                                            th:text="${course.courseCode + ' | ' + course.courseName + ' | ' + course.credits + ' CR'}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Semester Selection (Simplified to 1, 2, 3 as requested) -->
                        <div class="col-12">
                            <label for="semester" class="form-label small fw-bold text-uppercase text-muted mb-2 ps-1">Academic Semester</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 px-3 text-secondary"><i class="bi bi-calendar3-event text-warning"></i></span>
                                <select class="form-select bg-light border-0 shadow-none p-4 h6 mb-0" id="semester" th:field="*{semester}" required>
                                    <option value="">Select Semester...</option>
                                    <option value="1">Academic Semester: 1</option>
                                    <option value="2">Academic Semester: 2</option>
                                    <option value="3">Academic Semester: 3</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Submission UI -->
                    <div class="d-flex justify-content-end align-items-center gap-3 mt-5 pt-4 border-top">
                        <a th:href="@{/registrations}" class="text-decoration-none text-muted fw-bold small p-2">Discard Changes</a>
                        <button type="submit" class="btn btn-info px-5 py-3 d-flex align-items-center rounded-4 h6 mb-0 shadow-sm text-dark font-weight-bold">
                            <i class="bi bi-cloud-upload-fill me-2 fs-5"></i> 
                            <span>Finalize Enrollment</span>
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- Contextual Note -->
            <div class="mt-4 p-4 border rounded-4 border-dashed bg-white bg-opacity-50 text-center animate-up" style="animation-delay: 0.2s;">
                <p class="small text-muted mb-0">
                    <i class="bi bi-info-circle me-1 text-info"></i> 
                    <strong>Instruction:</strong> Enrollments link student database records with course catalog specifications for academic tracking.
                </p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
