<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Directory | SMsystem</title>
    <div th:replace="~{fragments/header :: styles}"></div>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4 animate-up">
    <div class="d-flex justify-content-between align-items-center mb-5 border-bottom pb-4">
        <div>
            <h2 class="fw-bold m-0 text-dark">Student Directory</h2>
            <p class="text-muted small">Manage records, monitor academic progress, and student profiles</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/students/add}" class="btn btn-primary d-flex align-items-center shadow-sm">
                <i class="bi bi-person-plus me-2 fs-5"></i> Add New Student
            </a>
        </div>
    </div>

    <div class="table-container shadow-sm border-0 bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Student Details</th>
                        <th>Academic Program</th>
                        <th>Year of Study</th>
                        <th class="text-center">Status</th>
                        <th class="text-end pe-4">Record Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td class="ps-4">
                            <span class="small text-muted fw-bold" th:text="'#STU' + ${student.id}">ID</span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="bg-primary bg-opacity-10 rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                    <i class="bi bi-person-fill text-primary"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold text-dark m-0" th:text="${student.name}">John Doe</h6>
                                    <p class="small text-muted m-0" th:text="${student.email}">john@edu.com</p>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="badge-soft badge-primary-soft small fw-semibold" th:text="${student.program}">Computer Science</span>
                        </td>
                        <td>
                            <span class="badge-soft badge-warning-soft small fw-semibold" th:text="${student.year}">1</span>
                        </td>
                        <td class="text-center">
                            <span class="badge-soft badge-success-soft small fw-bold"><i class="bi bi-check-circle me-1"></i> Active</span>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Horizontal Actions Layout (As requested) -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/students/profile/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-outline-info border-0 rounded-circle p-2 d-flex align-items-center justify-content-center" 
                                   style="width: 32px; height: 32px;" title="View Profile">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/students/edit/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-outline-primary border-0 rounded-circle p-2 d-flex align-items-center justify-content-center" 
                                   style="width: 32px; height: 32px;" title="Edit Student">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-outline-danger border-0 rounded-circle p-2 d-flex align-items-center justify-content-center" 
                                   style="width: 32px; height: 32px;" 
                                   onclick="return confirm('Delete this student and all their registrations?')" title="Delete Record">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted p-5">
                                <i class="bi bi-person-dash fs-1 d-block mb-3 opacity-25"></i>
                                <h5 class="fw-bold">No Records Found</h5>
                                <p class="small">The student list is currently empty.</p>
                                <a th:href="@{/students/add}" class="btn btn-sm btn-outline-primary mt-2">New Registration</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
