<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Profile | SMsystem</title>
    <div th:replace="~{fragments/header :: styles}"></div>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4 animate-up">
    <div class="row g-4">
        <!-- Sidebar: Basic Info -->
        <div class="col-lg-4">
            <div class="glass-card text-center p-5 sticky-top" style="top: 100px; z-index: 10;">
                <div class="bg-primary bg-opacity-10 rounded-circle d-inline-block mx-auto mb-4 border border-primary border-opacity-20 p-2">
                    <div class="bg-white rounded-circle d-flex align-items-center justify-content-center" style="width: 100px; height: 100px;">
                        <i class="bi bi-person-fill text-primary display-4 m-0"></i>
                    </div>
                </div>
                <h3 class="fw-bold text-dark mb-1" th:text="${student.name}">Student Name</h3>
                <p class="text-muted small mb-3" th:text="${student.email}">Email</p>
                <div class="d-flex justify-content-center gap-2 mb-4">
                    <span class="badge-soft badge-primary-soft small" th:text="${student.program}">Computer Science</span>
                    <span class="badge-soft badge-success-soft small" th:text="'Year ' + ${student.year}">Year 1</span>
                </div>
                <div class="d-grid gap-2">
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-primary">
                        <i class="bi bi-pencil-square me-2"></i> Edit Profile
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content: Details & Registrations -->
        <div class="col-lg-8">
            <div class="glass-card p-4 mb-4">
                <h5 class="fw-bold mb-4 d-flex align-items-center">
                    <i class="bi bi-person-lines-fill text-primary me-2"></i> Personal Details
                </h5>
                <div class="row g-4">
                    <div class="col-sm-6">
                        <label class="small text-muted fw-bold text-uppercase mb-1 d-block">Full Name</label>
                        <p class="h6 fw-bold m-0" th:text="${student.name}"></p>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted fw-bold text-uppercase mb-1 d-block">Student ID</label>
                        <p class="h6 fw-bold m-0" th:text="'#STU' + ${student.id}"></p>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted fw-bold text-uppercase mb-1 d-block">Academic Program</label>
                        <p class="h6 fw-bold m-0" th:text="${student.program}"></p>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted fw-bold text-uppercase mb-1 d-block">Year of Study</label>
                        <p class="h6 fw-bold m-0" th:text="${student.year}"></p>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted fw-bold text-uppercase mb-1 d-block">Email Address</label>
                        <p class="h6 fw-bold m-0" th:text="${student.email}"></p>
                    </div>
                </div>
            </div>

            <!-- Course Registrations -->
            <div class="glass-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0 d-flex align-items-center">
                        <i class="bi bi-journal-check text-success me-2"></i> Current Registrations
                    </h5>
                    <a th:href="@{/registrations/register(studentId=${student.id})}" class="btn btn-sm btn-outline-primary border-dashed">
                        <i class="bi bi-plus-lg me-1"></i> Enroll in Course
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Course</th>
                                <th>Code</th>
                                <th class="text-center">Credits</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reg : ${registrations}">
                                <td>
                                    <div class="fw-bold" th:text="${courseService.getCourseById(reg.courseId)?.courseName}">Course Name</div>
                                    <div class="small text-muted" th:text="${courseService.getCourseById(reg.courseId)?.lecturer}">Lecturer</div>
                                </td>
                                <td>
                                    <span class="badge-soft badge-primary-soft small" th:text="${courseService.getCourseById(reg.courseId)?.courseCode}">CS101</span>
                                </td>
                                <td class="text-center fw-bold text-dark" th:text="${courseService.getCourseById(reg.courseId)?.credits}">3</td>
                                <td class="text-end">
                                    <a th:href="@{/registrations/delete/{id}(id=${reg.id})}" 
                                       class="btn btn-sm btn-outline-danger border-0" 
                                       onclick="return confirm('Are you sure you want to drop this course?')">
                                        <i class="bi bi-x-circle me-1"></i> Drop
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(registrations)}">
                                <td colspan="4" class="text-center py-4">
                                    <div class="text-muted small">
                                        <i class="bi bi-info-circle me-1"></i> No courses registered yet.
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="mt-4">
                <a th:href="@{/students}" class="text-decoration-none text-muted small fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> BACK TO STUDENT DIRECTORY
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
